# Based on the instructions at https://github.com/bazel-contrib/publish-to-bcr
name: "Publish to my Bazel registry"

on:
  workflow_call:
    secrets:
      BCR_PUBLISH_TOKEN:
        # Required: the reusable workflow below pushes to the registry with
        # it, and an unset secret surfaces only as an opaque git auth failure
        # after the release has already been tagged and uploaded.
        required: true
        description: 'Classic PAT with `public_repo` scope, used to push the registry entry and open the PR.'
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  # Fail fast, and say why: without this check a bad token is not discovered
  # until the very last step of the publish, leaving a published release with
  # no registry entry (see filmil/upspin-gdrive#20 for the incident this
  # pattern comes from).
  check-token:
    runs-on: ubuntu-latest
    steps:
      - name: Verify BCR_PUBLISH_TOKEN is usable
        env:
          TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
          REGISTRY: filmil/bazel-registry
        run: |
          set -o errexit -o nounset -o pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::BCR_PUBLISH_TOKEN is empty. Mint a classic PAT with the 'public_repo' scope and set it with: gh secret set BCR_PUBLISH_TOKEN -R ${{ github.repository }}"
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REGISTRY}")"
          if [ "${code}" != "200" ]; then
            echo "::error::BCR_PUBLISH_TOKEN cannot read ${REGISTRY} (HTTP ${code}) -- expired, revoked, or wrong kind. A classic PAT is required; fine-grained tokens cannot open pull requests against public repositories."
            exit 1
          fi
          echo "BCR_PUBLISH_TOKEN authenticates and can see ${REGISTRY}."

  publish:
    needs: check-token
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      # The registry for which the PR will be opened.
      registry: filmil/bazel-registry
      # The fork of `registry`. It can be the same repo.
      registry_fork: filmil/bazel-registry
      attest: false
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
