name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 6 * * 0"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build the module's own targets
        run: bazel build //...
      - name: Assemble the bundle (staged, no archive)
        run: SKIP_TAR=1 tools/make_bundle.sh
      - name: Build integration (real PDFs via the staged bundle)
        run: cd integration && bazel build //...
